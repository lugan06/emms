# Install as /etc/nginx/sites-available/eems.conf and enable in sites-enabled.
# Disable Ubuntu's default site first: only one default_server per address/port.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/eems/dist;
    index index.html;

    # Maximum size of the whole request, including multipart overhead.
    client_max_body_size 200m;
    client_body_timeout 600s;

    # Shared by the API and OpenAPI/Swagger proxy locations below.
    # SiteContextFilter resolves the site using the original request hostname.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Forwarded "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    location = /api {
        proxy_pass http://127.0.0.1:8080;
    }

    location ^~ /api/ {
        # No URI suffix: backend controllers require the original /api prefix.
        proxy_pass http://127.0.0.1:8080;
    }

    location = /uploads {
        return 301 /uploads/;
    }

    location ^~ /uploads/ {
        # Matches eems.file.local-path and eems.file.public-url-prefix in prod.
        alias /data/ems-uploads/;
        autoindex off;
    }

    # Apifox synchronizes this backend endpoint; it must bypass the Vue fallback.
    location = /v3/api-docs {
        proxy_pass http://127.0.0.1:8080;
    }

    location ^~ /v3/api-docs/ {
        proxy_pass http://127.0.0.1:8080;
    }

    location = /swagger-ui.html {
        proxy_pass http://127.0.0.1:8080;
    }

    location ^~ /swagger-ui/ {
        proxy_pass http://127.0.0.1:8080;
    }

    # Missing build assets must return 404 instead of index.html.
    location ^~ /assets/ {
        try_files $uri =404;
    }

    # Vue Router uses createWebHistory() with the site root as its base.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
