spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_PROD_URL:}
    username: ${DB_PROD_USERNAME:}
    password: ${DB_PROD_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
    com.eems: INFO

eems:
  jwt:
    secret: ${JWT_SECRET:}
  file:
    storage-type: local
    local-path: /data/ems-uploads
    public-url-prefix: /uploads
