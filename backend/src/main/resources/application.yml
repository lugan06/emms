spring:
  application:
    name: eems-backend
  profiles:
    default: local
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE:10MB}
      max-request-size: ${FILE_MAX_REQUEST_SIZE:10MB}

springdoc:
  api-docs:
    path: /v3/api-docs
    version: OPENAPI_3_0
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true

server:
  port: 8080
  servlet:
    context-path: /

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.eems.**.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

eems:
  jwt:
    secret: ${JWT_SECRET:change-this-local-secret-key-to-a-long-random-value-please}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:7200}
  file:
    storage-type: ${FILE_STORAGE_TYPE:local}
    local-path: ${FILE_LOCAL_PATH:./data/uploads}
    public-url-prefix: ${FILE_PUBLIC_URL_PREFIX:/uploads}
    max-file-size-bytes: ${FILE_MAX_SIZE_BYTES:10485760}
  seed:
    admin:
      enabled: ${EEMS_SEED_ADMIN_ENABLED:false}
      username: ${EEMS_SEED_ADMIN_USERNAME:}
      password: ${EEMS_SEED_ADMIN_PASSWORD:}
      nickname: ${EEMS_SEED_ADMIN_NICKNAME:系统管理员}
      role-code: ${EEMS_SEED_ADMIN_ROLE_CODE:SUPER_ADMIN}
